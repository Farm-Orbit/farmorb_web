# A string used to distinguish different Supabase projects on the same host.
project_id = "farmorb_web"

[api]
enabled = true
# Offset from mediops defaults (54321+) to avoid port conflicts
port = 54421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 15

[db.pooler]
enabled = false
port = 54429

[studio]
enabled = true
port = 54423

[local_smtp]
enabled = true
port = 54424

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
inspector_port = 8183

[analytics]
enabled = true
port = 54427
